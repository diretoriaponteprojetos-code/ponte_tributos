rule_id: TAX-IBS-2026-001
title: IBS — alíquota estadual de teste em 2026
subject:
  tax: IBS
  incidence_hypothesis: fatos geradores ocorridos de 1º de janeiro a 31 de dezembro de 2026
scope:
  jurisdiction:
    level: ESTADUAL
  regimes:
    - LUCRO_PRESUMIDO
    - LUCRO_REAL
    - IMUNE_ISENTA
  taxpayer_conditions:
    - contribuinte sujeito ao IBS no período de teste
    - não optante pelo Simples Nacional (LC 214/2025, art. 348, III, "c")
condition:
  event_date:
    from: 2026-01-01
    to: 2026-12-31
effect:
  kind: RATE
  rate:
    value: 0.1
    unit: percent
exceptions:
  - description: >-
      Operações sujeitas a alíquota reduzida em regimes diferenciados: a
      alíquota de teste é aplicada com a respectiva redução (art. 348, III, "a").
  - description: >-
      Regimes específicos: aplicação sobre as respectivas bases de cálculo,
      exceto combustíveis e biocombustíveis dos arts. 172 a 180 (art. 348, III, "b").
  - description: >-
      Não se aplica às operações de contribuintes optantes pelo Simples
      Nacional (art. 348, III, "c").
  - description: >-
      Dispensa do recolhimento para o sujeito passivo que cumprir as obrigações
      acessórias previstas na legislação (art. 348, § 1º); se recolhido, o
      montante é compensado com PIS/Cofins do mesmo período (art. 348, I e II).
      A modelar como regra própria.
authority:
  source: SRC-RFB-LC214
  article: "343"
validity:
  publication_date: 2025-01-16
  valid_from: 2026-01-01
  valid_until: 2026-12-31
  retrieved_at: 2026-10-29
status: ACTIVE
