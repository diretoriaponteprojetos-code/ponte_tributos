rule_id: TAX-IBS-2027-UF-001
title: IBS — alíquota estadual de 2027 a 2028
subject:
  tax: IBS
  incidence_hypothesis: fatos geradores ocorridos de 1º de janeiro de 2027 a 31 de dezembro de 2028
scope:
  jurisdiction:
    level: ESTADUAL
  taxpayer_conditions:
    - contribuinte sujeito ao IBS
condition:
  event_date:
    from: 2027-01-01
    to: 2028-12-31
effect:
  kind: RATE
  rate:
    value: 0.05
    unit: percent
exceptions:
  - description: >-
      Operações sujeitas a alíquota reduzida em regimes diferenciados: aplicada
      com a respectiva redução (art. 344, parágrafo único, I).
  - description: >-
      Regimes específicos: aplicada sobre as respectivas bases de cálculo,
      exceto combustíveis dos arts. 172 a 180 (art. 344, parágrafo único, II).
  - description: >-
      Combustíveis dos arts. 172 a 180: aplicada sobre o valor da operação no
      momento da incidência da CBS (art. 344, parágrafo único, III).
authority:
  source: SRC-RFB-LC214
  article: "344"
