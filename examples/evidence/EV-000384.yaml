locator:
  article: "348"
  section: Seção III — Disposições Comuns ao IBS e à CBS em 2026
text: >-
  Art. 348. Em relação aos fatos geradores ocorridos de 1º de janeiro a 31 de
  dezembro de 2026:
  I - o montante recolhido do IBS e da CBS será compensado com o valor devido,
  no mesmo período de apuração, das contribuições previstas no art. 195,
  inciso I, alínea "b", e inciso IV, e da contribuição para o PIS a que se
  refere o art. 239, ambos da Constituição Federal;
  II - caso o contribuinte não possua débitos suficientes para efetuar a
  compensação de que trata o inciso I, o valor recolhido poderá ser:
  a) compensado com qualquer outro tributo federal, nos termos da legislação; ou
  b) ressarcido em até 60 (sessenta) dias, mediante requerimento;
  III - as alíquotas do IBS e da CBS previstas nos arts. 343 e 346 desta Lei
  Complementar:
  a) serão aplicadas com a respectiva redução no caso das operações sujeitas a
  alíquota reduzida, no âmbito de regimes diferenciados de tributação;
  b) serão aplicadas em relação aos regimes específicos de que trata esta Lei
  Complementar, observadas as respectivas bases de cálculo, exceto em relação
  aos combustíveis e biocombustíveis de que tratam os arts. 172 a 180;
  c) não serão aplicadas em relação às operações dos contribuintes optantes
  pelo Simples Nacional.
  § 1º Fica dispensado o recolhimento do IBS e da CBS relativo aos fatos
  geradores ocorridos no período indicado no caput em relação aos sujeitos
  passivos que cumprirem as obrigações acessórias previstas na legislação.
  § 2º O sujeito passivo dispensado do recolhimento na forma do § 1º permanece
  obrigado ao pagamento integral das Contribuições previstas no art. 195,
  inciso I, alínea "b", e inciso IV, e da contribuição para o Programa de
  Integração Social a que se refere o art. 239, ambos da Constituição Federal.
  § 3º Durante o período a que se refere o caput deste artigo, caso seja
  lavrado auto de infração por descumprimento das obrigações acessórias
  relativas ao IBS e à CBS previstas no art. 341-G desta Lei Complementar, o
  sujeito passivo será intimado para, no prazo de 60 (sessenta) dias contado da
  intimação, suprir a omissão apontada pela fiscalização. (Incluído pela Lei
  Complementar nº 227, de 2026)
  § 4º O atendimento à intimação a que se refere o § 3º deste artigo importa
  extinção da penalidade imposta ao sujeito passivo. (Incluído pela Lei
  Complementar nº 227, de 2026)
