text: >-
  Art. 348 (síntese a substituir pela transcrição literal): em relação aos fatos
  geradores de 1º de janeiro a 31 de dezembro de 2026, o valor recolhido de IBS e
  CBS será compensado com o valor devido, no mesmo período de apuração, das
  contribuições do art. 195, I, "b", e IV, e da contribuição para o PIS do
  art. 239 da Constituição; § 1º: fica dispensado do recolhimento o contribuinte
  que cumprir as obrigações acessórias previstas na legislação; § 2º: o
  contribuinte dispensado permanece obrigado ao pagamento integral dessas
  contribuições.
