source: SRC-RFB-ENTENDA-RTC
kind: TEXT
locator:
  section: Transição
text: >-
  2026
  Ano teste da CBS e do IBS;
  O montante arrecadado da CBS (0,9%) e do IBS (0,1%) será compensado com o
  valor devido de PIS e COFINS, no mesmo período de liquidação;
  Ficará isenta a arrecadação da taxa de prova da CBS e do IBS, em 2026, para
  os contribuintes que cumprirem com as obrigações acessórias, conforme a
  legislação.
  2027 e 2028
  Cobrança de CBS com a alíquota reduzida em 0.1 (um décimo) ponto percentual.
  Cobrança de IBS com alíquota de 0.1 (um décimo) ponto percentual.
observed_at: 2026-10-29
verification_status: VERIFIED_AGAINST_SOURCE
client_specific: false
provenance:
  created_at: "2026-09-15T12:00:00-03:00"
