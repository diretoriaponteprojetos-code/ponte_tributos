  method: MANUAL
  notes: >-
    Transcrição literal do HTML institucional (sha256 6c154ab9…), conferida em
    2026-10-29 via `tools/ingest_source.py SRC-RFB-ENTENDA-RTC --grep
    "0,9|0,1|2026"`. Substitui a paráfrase anterior. Corrobora os arts. 343,
    346 e 348 da LC 214/2025 (EV-000381, EV-000383, EV-000384) e os arts. 344
    e 347 (EV-000385, EV-000386). Imprecisões da página: "isenta a
    arrecadação" onde a lei diz "dispensado o recolhimento"; "IBS com alíquota
    de 0.1 p.p." em 2027-2028 corresponde a 0,05% estadual + 0,05% municipal.
