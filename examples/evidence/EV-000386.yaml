locator:
  article: "347"
  section: Seção II — Da Fixação das Alíquotas da CBS durante a Transição
text: >-
  Art. 347. Em relação aos fatos geradores ocorridos de 1º de janeiro de 2027 a
  31 de dezembro de 2028, a alíquota da CBS será aquela fixada nos termos do
  inciso I do caput e dos §§ 2º e 3º, todos do art. 14, reduzida em 0,1 (um
  décimo) ponto percentual, exceto em relação aos combustíveis sujeitos ao
  regime específico de que tratam os arts. 172 a 180 desta Lei Complementar.
  § 1º A redução da alíquota prevista no caput será:
  I - proporcional à respectiva redução no caso das operações sujeitas a
  alíquota reduzida, no âmbito de regimes diferenciados de tributação;
  II - aplicada em relação aos regimes específicos de que trata essa Lei
  Complementar, observadas as respectivas bases de cálculo.
  § 2º Durante o período de que trata o caput deste artigo, o montante de IBS
  recolhido nos termos do inciso III do parágrafo único do art. 344 poderá ser
  deduzido do montante da CBS a recolher pelos contribuintes sujeitos ao regime
  específico de combustíveis de que tratam os arts. 172 a 180 desta Lei
  Complementar.
