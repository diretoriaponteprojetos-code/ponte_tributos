locator:
  article: "344"
  section: Seção I — Da Fixação das Alíquotas do IBS durante a Transição
text: >-
  Art. 344. Em relação aos fatos geradores ocorridos de 1º de janeiro de 2027 a
  31 de dezembro de 2028, o IBS será cobrado à alíquota estadual de 0,05%
  (cinco centésimos por cento) e à alíquota municipal de 0,05% (cinco
  centésimos por cento).
  Parágrafo único. As alíquotas previstas no caput:
  I - serão aplicadas com a respectiva redução no caso das operações sujeitas a
  alíquota reduzida, no âmbito de regimes diferenciados de tributação;
  II - serão aplicadas em relação aos regimes específicos de que trata esta Lei
  Complementar, observadas as respectivas bases de cálculo, exceto em relação
  aos combustíveis sujeitos ao regime específico de que tratam os arts. 172 a
  180 desta Lei Complementar; e
  III - em relação aos combustíveis sujeitos ao regime específico de que tratam
  os arts. 172 a 180 desta Lei Complementar, as alíquotas de que trata o caput
  deste artigo serão aplicadas sobre o valor da operação no momento da
  incidência da CBS.
  IV - serão consideradas como alíquotas de referência do IBS para fins do
  disposto no § 2º do art. 189, no § 8º do art. 485, no § 13 do art. 486 e no
  § 12 do art. 487. (Incluído pela Lei Complementar nº 227, de 2026)
