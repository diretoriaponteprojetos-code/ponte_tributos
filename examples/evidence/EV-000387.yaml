  section: Seção VI — Das Alíquotas, Subseção I — Das Alíquotas-Padrão
text: >-
  Art. 14. As alíquotas da CBS e do IBS serão fixadas por lei específica do
  respectivo ente federativo, nos seguintes termos:
  I - a União fixará a alíquota da CBS;
  II - cada Estado fixará sua alíquota do IBS;
  III - cada Município fixará sua alíquota do IBS; e
  IV - o Distrito Federal exercerá as competências estadual e municipal na
  fixação de suas alíquotas.
  § 1º Para fins do disposto no inciso III do caput deste artigo, o Estado de
  Pernambuco exercerá a competência municipal relativamente às operações
  realizadas no Distrito Estadual de Fernando de Noronha, conforme o art. 15 do
  Ato das Disposições Constitucionais Transitórias (ADCT).
  § 2º Ao fixar sua alíquota, cada ente federativo poderá:
  I - vinculá-la à alíquota de referência da respectiva esfera federativa, de
  que trata o art. 18 desta Lei Complementar, por meio de acréscimo ou
  decréscimo de pontos percentuais; ou
  II - defini-la sem vinculação à alíquota de referência da respectiva esfera
  federativa.
  § 3º Na ausência de lei específica que estabeleça a alíquota do ente
  federativo, será aplicada a alíquota de referência da respectiva esfera
  federativa.
  § 4º As referências nesta Lei Complementar às alíquotas-padrão devem ser
  entendidas como remissões às alíquotas fixadas por cada ente federativo nos
  termos deste artigo.
