source: SRC-RFB-LC214
kind: TEXT
locator:
  article: "343"
text: >-
  Art. 343. Em relação aos fatos geradores ocorridos de 1º de janeiro a 31 de
  dezembro de 2026, o IBS será cobrado mediante aplicação da alíquota estadual
  de 0,1% (um décimo por cento).
  Parágrafo único. Durante o período indicado no caput deste artigo a
  arrecadação do IBS não observará as vinculações, repartições e destinações
  previstas na Constituição Federal, devendo ser aplicada, integral e
  sucessivamente, para:
  I - o financiamento do Comitê Gestor do IBS, nos termos do art. 156-B, § 2º,
  III, da Constituição Federal; e
  II - compor o Fundo de Compensação de Benefícios Fiscais ou
  Financeiro-Fiscais do ICMS.
